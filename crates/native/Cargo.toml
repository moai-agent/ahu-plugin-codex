[package]
name = "ahu-harness-native"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Native provider implementation support, linked only by harness runtime plugins"

[dependencies]
ahu-harness-events = { path = "../events" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"
sha2 = "0.10"
libc = "0.2"
tempfile = "3"
yaml_serde = "0.10"
